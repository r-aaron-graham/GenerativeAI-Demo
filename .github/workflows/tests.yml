name: Response evaluation tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed modules outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m benchmark
          python -m challenge
          python -c 'from evaluate import evaluate; assert evaluate({"summary":"Example","sources":["s1"]}, ["s1"])["passed"]'
